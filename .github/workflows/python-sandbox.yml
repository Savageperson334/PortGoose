name: Python mutation sandbox

on:
  push:
    branches: [main]
    paths:
      - sandbox-input.json
      - scripts/mutate.py
      - tests/test_mutate.py
      - .github/workflows/python-sandbox.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portgoose-mutator
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate and commit current model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recalculate after each fetch. Older queued runs must NOT
          # overwrite the output for a newer mutation request.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/mutate.py
            git add sandbox.json
            if git diff --cached --quiet; then
              echo "Already up to date."
              exit 0
            fi
            git commit -m "sandbox: render current mutation stack"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed, recalculating latest state..."
            sleep 2
          done
          echo "Unable to publish latest sandbox state." >&2
          exit 1
