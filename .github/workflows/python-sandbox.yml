name: Python sandbox

on:
  push:
    branches: [main]
    paths:
      - log.json
      - scripts/process_log.py
      - tests/test_processor.py
      - .github/workflows/python-sandbox.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portgoose-python-sandbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run evaluator tests
        run: python -m unittest discover -s tests -v

      - name: Process latest math command
        run: python scripts/process_log.py

      - name: Commit updated sandbox data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sandbox.json; then
            echo "No sandbox change."
            exit 0
          fi
          git add sandbox.json
          git commit -m "sandbox: update Python math result"
          # A simultaneous form submission may have moved main. Rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push sandbox result after retries." >&2
          exit 1
